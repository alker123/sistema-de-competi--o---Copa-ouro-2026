    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/imagem/27.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/css/adm-ope-arb.header.botao.css">
    <link rel="stylesheet" href="/css/adm-ope.enviar.para.jurados-checkbox.css">

    <link rel="stylesheet" href="/css/operadorplanilha1.css">
    <link rel="stylesheet" href="/css/operadorplanilha2.css">
    <link rel="stylesheet" href="/css/cadastra-atleta.css">
    <link rel="stylesheet" href="/css/cadastra-categoria.css">
    <link rel="stylesheet" href="/css/enviar-para-operador.css">
    <link rel="stylesheet" href="/css/cadastra-arbitro.css">
    <link rel="stylesheet" href="/css/cadastra-usuario.css">

</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container3">
            <div class="header-content">
                <div class="logo">
                    <h1>🏆 ADMINISTRADOR</h1>
                    <p>Sistema de Competição de Capoeira</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main">

        <div class="container25">
            <button id="usuario1" class="btn btn-large1">Cadastra Usuario</button>
            <button id="planilha1" class="btn btn-large1">Planilha Notas</button>
            <button id="arbitro1" class="btn btn-large1">Cadastra Arbitro</button>
            <button id="categoria1" class="btn btn-large1">Cadastrar Categoria</button>
            <button id="atleta1" class="btn btn-large1">Cadastrar Atleta</button>
            <button id="excluir-categoria1" class="btn btn-large1">Excluir Categoria</button>
            <button id="excluir-atleta1" class="btn btn-large1">Excluir Atleta</button>
            <button id="enviar-jurado1" class="btn btn-large1">Enviar para Jurado</button>
            <button id="enviar-operador1" class="btn btn-large1">Enviar para Operador</button>
            <button id="banco-de-dados" class="btn btn-large1">Banco de Dados</button>
            <button id="banco-de-dados1" class="btn btn-large1">Banco de imagem</button>
        </div>

        <!-- CONTAINER PRINCIPAL -->
        <div id="container-tabelas" class="tabela-container1">

            <!-- TABELA PRINCIPAL -->
            <div id="tabela-principal" class="tabela-view">
                <div class="container1">
                    <div class="botoes-acoes" style="margin-bottom:10px;">

                        <div>
                            <h2>
                                Jogo: <span id="ritmo-atual">Selecionar</span>
                                <select id="seletor-ritmo" class="select-estilizado">
                                    <option value="">Selecionar</option>
                                    <option value="1º Jogo">1º Jogo</option>
                                    <option value="2º Jogo">2º Jogo</option>
                                    <option value="3º Jogo">3º Jogo</option>
                                    <option value="4º Jogo">4º Jogo</option>
                                </select>
                            </h2>

                            <!-- Seletor de Grupo de Fases -->
                            <label for="seletor-fase-grupo">Fase:</label>
                            <select id="seletor-fase-grupo">
                                <option>Selecionar</option>
                                <option value="classificatória">Classificatória</option>
                                <option value="oitavas">Oitavas</option>
                                <option value="quartas">Quartas</option>
                                <option value="semifinal">Semi-final</option>
                                <option value="final">Final</option>
                            </select>

                            <label for="seletor-categoria" class="label-categoria">Categoria:</label>
                            <select id="seletor-categoria" class="select-estilizado2">
                                <option value="">Todas</option>
                            </select>

                            <button id="PDF0" onclick="BaixarPDF()">Download PDF</button>
                            <button id="imprimir1" onclick="Imprimir1()">IMPRIMIR</button>
                        </div>
                    </div>

                    <div class="botoes-acoes1" style="margin-top:10px;">
                        <button id="MediaTotal" onclick="MediaTotal()">Média Total</button>
                        <button id="excluir" onclick="excluirLinhasSelecionadas()">Excluir Linhas Selecionadas</button>
                    </div>

                </div>

                <div class="scroll-tabela">
                    <div class="container-nomes-arbitros">
                        <div class="spacer"></div>

                        <input type="text" id="arbitroA" class="input-arbitro-alinhado" placeholder="Árbitro A"
                            readonly />
                        <input type="text" id="arbitroB" class="input-arbitro-alinhado" placeholder="Árbitro B"
                            readonly />
                        <input type="text" id="arbitroC" class="input-arbitro-alinhado" placeholder="Árbitro C"
                            readonly />

                        <div class="spacer-media"></div>
                    </div>

                    <table id="tabela-principal1" border="1" cellspacing="0" cellpadding="5">
                        <thead>
                            <tr>
                                <th id="sel" class="col-sel">Sel.</th>
                                <th id="atleta" class="col-atleta">Atleta</th>
                                <th id="categoria" class="col-cat">Categoria</th>
                                <th id="notaA" class="col-notaA">Nota</th>
                                <th id="notaB" class="col-notaB">Nota</th>
                                <th id="notaC" class="col-notaC">Nota</th>
                                <th id="media" class="col-media">Média</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="empty-message">Nenhum dado encontrado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <!-- TABELA SECUNDÁRIA -->
            <div id="tabela-secundaria" class="tabela-view" style="display:none;">
                <div class="container1">
                    <h2 id="h2-1">
                        Nota de Atletas
                    </h2>

                    <div class="botoes-acoes" style="margin-bottom:10px;">
                        <div>
                            <label for="seletor-categoria125" class="label-categoria1">Categoria:</label>
                            <select id="seletor-categoria125" class="select-estilizado33">
                                <option value="">Todas</option>
                            </select>

                            <!-- Seletor de Grupo de Fases -->
                            <label for="seletor-fase-grupo1">Fase:</label>
                            <select id="seletor-fase-grupo1">
                                <option>Selecionar</option>
                                <option value="classificatória">Classificatória</option>
                                <option value="oitavas">Oitavas</option>
                                <option value="quartas">Quartas</option>
                                <option value="semifinal">Semi-final</option>
                                <option value="final">Final</option>
                            </select>

                            <button id="PDF1" onclick="baixarPDF1()">Download PDF</button>
                            <button id="imprimir2" onclick="Imprimir2()">IMPRIMIR</button>
                            <button id="salvar2" onclick="salvar2()">Salvar</button>
                            <button id="terceiro1" onclick="terceiro()">Terçeiro</button>
                            <button id="segundo1" onclick="segundo()">Segundo</button>
                        </div>

                        <div class="botoes-acoes" style="margin-top:10px;">
                            <button id="voltarParaTabelaPrincipal" onclick="voltarParaTabelaPrincipal()">Voltar</button>
                            <button id="oitavas" onclick="oitavas()">Oitavas</button>
                            <button id="quartas" onclick="quartas()">Quartas</button>
                            <button id="semifinal" onclick="semifinal()">Semi-Final</button>
                            <button id="final" onclick="final()">Final</button>
                            <button id="enviar1" onclick="enviar1()">Enviar</button>
                        </div>

                    </div>
                </div>

                <div class="scroll-tabela1">
                    <table id="tabela-secundaria3" border="1" cellspacing="0" cellpadding="5">
                        <thead>
                            <tr>
                                <th id="sel">Sel.</th>
                                <th id="foto3">Foto</th>
                                <th id="posicao">Posição</th>
                                <th id="atleta1">Atleta</th>
                                <th id="categoria1">Categoria</th>
                                <th id="1º Jogo" class="jogo1">1º Jogo</th>
                                <th id="2º Jogo" class="jogo2">2º Jogo</th>
                                <th id="3º Jogo" class="jogo3">3º Jogo</th>
                                <th id="4º Jogo" class="jogo4">4º Jogo</th>
                                <th id="notaFinal">Nota Final</th>
                                <th id="classificado">Proxima Fase</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="11" class="empty-message">Nenhum dado encontrado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="statusMessage"
                    style="display:none; padding: 10px; margin-top: 20px; font-size: 16px; font-weight: bold;">
            </div>

            </div>
        </div>

      


        

    </main>

    <script type="module" src="/js/operadorplanilha02.js"></script>
    <script type="module" src="/js/PrimeiroSegundo.js"></script>

    <script type="module" src="/js/tela11.js"></script>
    <script type="module" src="/js/trocadecategoria.js"></script>
    <script src="/js/operadorBotao.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>



</body>

</html>
